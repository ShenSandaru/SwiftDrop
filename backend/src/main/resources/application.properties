spring.application.name=swiftdrop-backend

# Local settings come from the repository-root .env file (see .env.example) when the backend runs
# from backend/. Environment variables with the same names take precedence over the file.
spring.config.import=optional:file:../.env[.properties]

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${SWIFTDROP_POSTGRES_HOST:localhost}:${SWIFTDROP_POSTGRES_PORT:5432}/${SWIFTDROP_POSTGRES_DB:swiftdrop}
spring.datasource.username=${SWIFTDROP_POSTGRES_USER:swiftdrop}
spring.datasource.password=${SWIFTDROP_POSTGRES_PASSWORD}

# Flyway owns the schema; Hibernate only validates it (see docs/ai-agent-guidelines.md, Project rules)
spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ
spring.rabbitmq.host=${SWIFTDROP_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SWIFTDROP_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SWIFTDROP_RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${SWIFTDROP_RABBITMQ_PASSWORD}
