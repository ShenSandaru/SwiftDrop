# Production profile for containerized deployment behind Nginx or Kubernetes Ingress.
# Activate by setting SPRING_PROFILES_ACTIVE=prod.

# Trust X-Forwarded-* headers from the reverse proxy / Ingress so OAuth2 redirects use
# https:// and per-IP rate limiters observe the client address rather than the proxy IP.
server.forward-headers-strategy=framework

# Drain in-flight HTTP requests, outbox relay polls, and RabbitMQ consumers cleanly on shutdown.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Expose liveness and readiness probe endpoints (/actuator/health/liveness, /actuator/health/readiness).
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Disable public Swagger UI and OpenAPI schema exposure in production by default.
springdoc.api-docs.enabled=${SWIFTDROP_SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWIFTDROP_SWAGGER_ENABLED:false}
