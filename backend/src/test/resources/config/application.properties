# Test-only settings, loaded on top of src/main/resources/application.properties
# (classpath:/config/ takes precedence over classpath:/).

# Most tests run without a database or RabbitMQ, so the scheduled outbox relay and notification
# consumer stay off. Tests of the relay or consumer themselves switch them on.
swiftdrop.outbox.relay.enabled=false
swiftdrop.notification.consumer.enabled=false
