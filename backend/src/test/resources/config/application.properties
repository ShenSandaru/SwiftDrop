# Test-only overrides. Spring Boot loads classpath:/config/application.properties after
# classpath:/application.properties, so only these keys change.
#
# Tests never publish to or declare queues on a developer's local RabbitMQ: the outbox relay is off and
# RabbitAdmin declares nothing (for example when /actuator/health opens a connection). The RabbitMQ
# integration tests switch both on against their own Testcontainers broker.
swiftdrop.outbox.relay.enabled=false
spring.rabbitmq.dynamic=false
