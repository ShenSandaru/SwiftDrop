# Test-only settings, loaded on top of src/main/resources/application.properties
# (classpath:/config/ takes precedence over classpath:/).

# Most tests run without a database or RabbitMQ, so the scheduled outbox relay stays off. Tests of
# the relay itself switch it on.
swiftdrop.outbox.relay.enabled=false

# The merchant event consumer listens on RabbitMQ and schedules reconciliation; tests of the consumer
# switch it on against their own broker.
swiftdrop.merchant.events.consumer.enabled=false

# The webhook sender polls the database and sends HTTP requests; its tests switch it on.
swiftdrop.merchant.webhooks.sender.enabled=false

# Encryption key for webhook signing secrets; test-only value, never used outside tests.
swiftdrop.merchant.webhook.secret-key=test-only-webhook-secret-key-not-used-outside-tests
