apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: swiftdrop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: swiftdrop
    spec:
      # Uncomment if ghcr.io/shensandaru/swiftdrop-frontend is Private:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/shensandaru/swiftdrop-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: NODE_OPTIONS
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
