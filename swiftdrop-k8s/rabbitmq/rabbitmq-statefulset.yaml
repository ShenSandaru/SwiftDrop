apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: swiftdrop
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: swiftdrop
    spec:
      containers:
        - name: rabbitmq
          # Alpine image without management UI to minimize memory usage and attack surface.
          image: rabbitmq:4.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
          env:
            # Stable node name matches StatefulSet pod hostname (rabbitmq-0) so Mnesia/Raft
            # quorum queue data survives pod restarts.
            - name: RABBITMQ_NODENAME
              value: "rabbit@rabbitmq-0"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                configMapKeyRef:
                  name: swiftdrop-config
                  key: SWIFTDROP_RABBITMQ_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: swiftdrop-secrets
                  key: SWIFTDROP_RABBITMQ_PASSWORD
            - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
              value: "-rabbit vm_memory_high_watermark 0.7"
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          startupProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_port_connectivity
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_port_connectivity
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - check_running
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
