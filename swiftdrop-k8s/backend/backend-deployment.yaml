apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: swiftdrop
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: swiftdrop
spec:
  # Single replica is required by the current architecture: LiveTracking SSE streams and public
  # tracking/assistant rate limiters store state in JVM memory (ADR 0007, ADR 0013).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: swiftdrop
    spec:
      # Uncomment if ghcr.io/shensandaru/swiftdrop-backend is Private:
      # imagePullSecrets:
      #   - name: ghcr-pull-secret
      terminationGracePeriodSeconds: 35
      containers:
        - name: backend
          image: ghcr.io/shensandaru/swiftdrop-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: swiftdrop-config
            - secretRef:
                name: swiftdrop-secrets
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
