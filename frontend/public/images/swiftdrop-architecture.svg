<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1190" width="760" height="1190" font-family="Inter, -apple-system, 'Segoe UI', DejaVu Sans, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">SwiftDrop system architecture and deployment</title>
  <desc id="d">Next.js portals, the public tracking page, merchant systems and MCP clients call a Spring Boot modular monolith with eight business modules. The monolith uses PostgreSQL and RabbitMQ, calls the Gemini API and sends signed webhooks to merchants. In production all traffic enters through Nginx on a Google Cloud VM that runs the frontend, backend, PostgreSQL and RabbitMQ with Docker Compose; GitHub Actions builds the images, publishes them to GHCR and deploys them over SSH. Single-node K3s manifests are an alternative target.</desc>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b998f"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  </defs>
  <rect width="760" height="1190" fill="#ffffff"/>

  <text x="24" y="30" font-size="17" font-weight="700" fill="#1f1e1d">SwiftDrop system architecture and deployment</text>
  <text x="736" y="30" text-anchor="end" font-size="11.5" fill="#5f5e5a">Modular monolith · REST · SSE · RabbitMQ</text>

  <!-- Presentation layer -->
  <rect x="24" y="46" width="712" height="112" rx="8" fill="#f3f2ee" stroke="#e2e0d8"/>
  <text x="40" y="66" font-weight="600" fill="#5f5e5a">Presentation layer</text>

