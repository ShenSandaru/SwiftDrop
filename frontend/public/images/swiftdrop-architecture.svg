  <rect x="40" y="222" width="680" height="268" rx="10" fill="#e6f4f2" stroke="#0f766e" stroke-width="2"/>
  <text x="56" y="244" font-weight="700" fill="#1f1e1d">Core API: Spring Boot 4 modular monolith (Java 21, one deployable)</text>
  <text x="56" y="262" font-size="11" fill="#33504c">REST /api/v1 · validation · central error handler · Spring Security: JWT, Google OAuth2, API keys</text>

