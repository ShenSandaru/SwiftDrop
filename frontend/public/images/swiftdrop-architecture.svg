  <text x="119" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Next.js web app</text>
  <text x="119" y="117" text-anchor="middle" font-size="11" fill="#5f5e5a">Role portals + chat widget</text>
  <text x="119" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">Calls the REST API directly</text>

  <rect x="214" y="78" width="158" height="66" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="293" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Public tracking page</text>
  <text x="293" y="117" text-anchor="middle" font-size="11" fill="#5f5e5a">No login, tracking number</text>
  <text x="293" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">Live updates over SSE</text>

  <rect x="388" y="78" width="158" height="66" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="467" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">Merchant systems</text>
  <text x="467" y="117" text-anchor="middle" font-size="11" fill="#5f5e5a">External, X-Api-Key header</text>
  <text x="467" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">Orders in, webhooks out</text>

  <rect x="562" y="78" width="158" height="66" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="641" y="100" text-anchor="middle" font-weight="600" fill="#1f1e1d">AI apps (MCP clients)</text>
  <text x="641" y="117" text-anchor="middle" font-size="11" fill="#5f5e5a">Claude Code, MCP Inspector</text>
  <text x="641" y="132" text-anchor="middle" font-size="11" fill="#5f5e5a">POST /mcp, read-only tools</text>

  <!-- Business logic layer -->
