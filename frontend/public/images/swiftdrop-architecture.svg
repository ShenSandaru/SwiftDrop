  <text x="380" y="1076" text-anchor="middle" font-size="10.5" fill="#5f5e5a">Namespace, ConfigMap, Secret, Deployments, StatefulSets with PVCs, Services, Traefik Ingress · same images · needs 4 GB RAM or more</text>

  <!-- Legend -->
  <line x1="24" y1="1116" x2="60" y2="1116" stroke="#9b998f" stroke-width="1.5"/>
  <text x="68" y="1120" font-size="11" fill="#1f1e1d">Synchronous call (REST, SQL, HTTPS, SSH)</text>
  <line x1="320" y1="1116" x2="356" y2="1116" stroke="#0f766e" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="364" y="1120" font-size="11" fill="#1f1e1d">Asynchronous (RabbitMQ, webhooks)</text>
  <rect x="600" y="1109" width="18" height="13" rx="3" fill="#ffffff" stroke="#9b998f" stroke-dasharray="4 3"/>
  <text x="626" y="1120" font-size="11" fill="#1f1e1d">External or optional</text>
  <text x="24" y="1148" font-size="11" fill="#5f5e5a">Local development uses Docker Compose for PostgreSQL and RabbitMQ only (compose.yaml).</text>
  <text x="24" y="1165" font-size="11" fill="#5f5e5a">The backend stays one replica: live-tracking streams and rate limiters keep state in memory (ADR 0013).</text>
  <text x="24" y="1182" font-size="11" fill="#5f5e5a">No API gateway, service mesh or WebSocket is used.</text>
</svg>
