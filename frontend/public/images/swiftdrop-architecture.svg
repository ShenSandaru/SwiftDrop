    <text x="66" y="295">identity</text><text x="232" y="295">pricing</text><text x="398" y="295">delivery</text><text x="564" y="295">dispatch</text>
    <text x="66" y="359">tracking</text><text x="232" y="359">merchant</text><text x="398" y="359">notification</text><text x="564" y="359">assistant</text>
  </g>
  <g font-size="10.5" fill="#1f1e1d">
    <text x="66" y="311">Auth · users · profiles</text><text x="66" y="324">Saved addresses</text>
    <text x="232" y="311">Zones · fee calculator</text><text x="232" y="324">Distance-based fares</text>
    <text x="398" y="311">Parcels · lifecycle</text><text x="398" y="324">Hubs · links · proofs</text>
    <text x="564" y="311">Courier assignment</text><text x="564" y="324">Hub steps · stale list</text>
    <text x="66" y="375">Public SSE stream</text><text x="66" y="388">Rate limited</text>
    <text x="232" y="375">API keys · orders</text><text x="232" y="388">HMAC webhooks · retries</text>
    <text x="398" y="375">In-app notifications</text><text x="398" y="388">Mock email and SMS</text>
    <text x="564" y="375">Chat + MCP server</text><text x="564" y="388">Gemini tool calling</text>
  </g>
  <g font-size="11" fill="#33504c">
    <text x="56" y="418">One transaction: status change, history row and outbox event (State pattern guards the moves)</text>
    <text x="56" y="434">Outbox relay publishes events to RabbitMQ; notification and merchant consume them</text>
    <text x="56" y="450">Hub network: central hub, direct links between branches, hub-scoped dispatchers and couriers</text>
    <text x="56" y="466">Flyway owns the schema · public endpoints are rate limited · SSE for live tracking, no WebSocket</text>
  </g>

