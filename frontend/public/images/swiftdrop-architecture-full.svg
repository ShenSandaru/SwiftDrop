<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" width="760" height="760" font-family="Inter, -apple-system, 'Segoe UI', DejaVu Sans, sans-serif" font-size="13" role="img" aria-labelledby="t d">
  <title id="t">SwiftDrop full architecture</title>
  <desc id="d">Customers, merchants, couriers, dispatchers, admins and AI apps reach Nginx on a Google Cloud VM. The ingress routes to a Next.js frontend and a Spring Boot modular monolith with eight modules. The backend uses PostgreSQL and RabbitMQ, calls Google sign-in and the Gemini API, and sends email, push notifications and merchant webhooks through RabbitMQ events. GitHub Actions builds images, publishes them to GHCR and deploys them to the VM; the VM runs the containers with Docker Compose.</desc>
  <defs>
    <marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9b998f"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e"/></marker>
  </defs>
  <rect width="760" height="760" fill="#ffffff"/>

  <text x="24" y="30" font-size="17" font-weight="700" fill="#1f1e1d">SwiftDrop architecture</text>
  <!-- Users -->
  <g fill="#ffffff" stroke="#9b998f" stroke-width="1.25">
    <rect x="31" y="50" width="130" height="40" rx="8"/>
    <rect x="173" y="50" width="130" height="40" rx="8"/>
    <rect x="315" y="50" width="130" height="40" rx="8"/>
    <rect x="457" y="50" width="130" height="40" rx="8"/>
    <rect x="599" y="50" width="130" height="40" rx="8" stroke-dasharray="6 4"/>
  </g>
  <g text-anchor="middle" font-weight="600" fill="#1f1e1d">
    <text x="96" y="75">Customer</text>
    <text x="238" y="75">Merchant</text>
    <text x="380" y="75">Courier</text>
    <text x="522" y="75">Dispatcher / Admin</text>
    <text x="664" y="75">AI apps (MCP)</text>
  </g>

  <!-- Cluster boundary -->
  <rect x="24" y="124" width="540" height="416" rx="10" fill="#fafaf8" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="40" y="143" font-weight="600" font-size="12" fill="#0f766e">Google Cloud VM · Docker containers</text>

  <!-- Ingress -->
  <rect x="40" y="156" width="508" height="40" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="294" y="181" text-anchor="middle" font-weight="600" fill="#1f1e1d">Nginx · HTTPS entry point</text>

  <!-- Frontend -->
  <rect x="40" y="228" width="130" height="210" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="105" y="252" text-anchor="middle" font-weight="600" fill="#1f1e1d">Frontend</text>
  <text x="105" y="270" text-anchor="middle" font-size="11" fill="#5f5e5a">Next.js</text>
  <text x="105" y="306" text-anchor="middle" font-size="11" fill="#5f5e5a">Role portals</text>
  <text x="105" y="324" text-anchor="middle" font-size="11" fill="#5f5e5a">Public tracking</text>
  <text x="105" y="342" text-anchor="middle" font-size="11" fill="#5f5e5a">Chat assistant</text>

  <!-- Backend -->
  <rect x="190" y="228" width="358" height="210" rx="8" fill="#e6f4f1" stroke="#0f766e" stroke-width="1.75"/>
  <text x="206" y="250" font-weight="700" fill="#0b5a54">Backend · Spring Boot</text>
  <text x="532" y="250" text-anchor="end" font-size="11" fill="#33504c">One replica</text>
  <g fill="#ffffff" stroke="#8cc9c0">
    <rect x="197" y="264" width="80" height="30" rx="6"/><rect x="285" y="264" width="80" height="30" rx="6"/>
    <rect x="373" y="264" width="80" height="30" rx="6"/><rect x="461" y="264" width="80" height="30" rx="6"/>
    <rect x="197" y="302" width="80" height="30" rx="6"/><rect x="285" y="302" width="80" height="30" rx="6"/>
    <rect x="373" y="302" width="80" height="30" rx="6"/><rect x="461" y="302" width="80" height="30" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11" font-weight="600" fill="#0b5a54">
    <text x="237" y="283">identity</text><text x="325" y="283">pricing</text>
    <text x="413" y="283">delivery</text><text x="501" y="283">dispatch</text>
    <text x="237" y="321">tracking</text><text x="325" y="321">merchant</text>
    <text x="413" y="321">notification</text><text x="501" y="321">assistant</text>
  </g>
  <g font-size="11" fill="#33504c">
    <text x="206" y="360">REST API with JWT and API-key security</text>
    <text x="206" y="378">Live parcel tracking over SSE</text>
    <text x="206" y="396">Events saved in an outbox, sent through RabbitMQ</text>
    <text x="206" y="414">Flyway migrations own the database schema</text>
  </g>

  <!-- Data row -->
  <rect x="190" y="474" width="170" height="46" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="275" y="494" text-anchor="middle" font-weight="600" fill="#1f1e1d">PostgreSQL</text>
  <text x="275" y="510" text-anchor="middle" font-size="11" fill="#5f5e5a">Data volume</text>
  <rect x="378" y="474" width="170" height="46" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="463" y="494" text-anchor="middle" font-weight="600" fill="#1f1e1d">RabbitMQ</text>
  <text x="463" y="510" text-anchor="middle" font-size="11" fill="#5f5e5a">Data volume</text>
  <rect x="40" y="474" width="130" height="46" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="105" y="494" text-anchor="middle" font-weight="600" fill="#1f1e1d">Environment file</text>
  <text x="105" y="510" text-anchor="middle" font-size="11" fill="#5f5e5a">Settings, passwords</text>

  <!-- External services -->
  <g fill="#ffffff" stroke="#9b998f" stroke-width="1.25" stroke-dasharray="6 4">
    <rect x="590" y="232" width="146" height="34" rx="8"/>
    <rect x="590" y="276" width="146" height="34" rx="8"/>
    <rect x="590" y="320" width="146" height="34" rx="8"/>
    <rect x="590" y="364" width="146" height="34" rx="8"/>
    <rect x="590" y="408" width="146" height="34" rx="8"/>
  </g>
  <g text-anchor="middle" font-weight="600" font-size="12" fill="#1f1e1d">
    <text x="663" y="247">Google OAuth2</text><text x="663" y="291">Gemini AI</text>
    <text x="663" y="335">Resend</text><text x="663" y="379">Firebase</text>
    <text x="663" y="423">Merchant systems</text>
  </g>
  <g text-anchor="middle" font-size="10.5" fill="#5f5e5a">
    <text x="663" y="260">Sign-in (optional)</text><text x="663" y="304">Assistant answers</text>
    <text x="663" y="348">Email (optional)</text><text x="663" y="392">Push (optional)</text>
    <text x="663" y="436">Receive webhooks</text>
  </g>
  <text x="590" y="222" font-size="11" font-weight="600" fill="#5f5e5a">External services</text>

  <!-- Delivery pipeline -->
  <rect x="24" y="576" width="112" height="60" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="80.0" y="595" text-anchor="middle" font-weight="600" font-size="12" fill="#1f1e1d">GitHub Actions</text>
  <text x="80.0" y="611" text-anchor="middle" font-size="10.5" fill="#5f5e5a">CI: lint, build, test</text>
  <text x="80.0" y="625" text-anchor="middle" font-size="10.5" fill="#5f5e5a">Builds images</text>
  <rect x="164" y="576" width="112" height="60" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="220.0" y="595" text-anchor="middle" font-weight="600" font-size="12" fill="#1f1e1d">GHCR</text>
  <text x="220.0" y="611" text-anchor="middle" font-size="10.5" fill="#5f5e5a">Container images</text>
  <text x="220.0" y="625" text-anchor="middle" font-size="10.5" fill="#5f5e5a">dev, latest, sha tags</text>
  <rect x="304" y="576" width="112" height="60" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="360.0" y="595" text-anchor="middle" font-weight="600" font-size="12" fill="#1f1e1d">Approval gate</text>
  <text x="360.0" y="611" text-anchor="middle" font-size="10.5" fill="#5f5e5a">Reviewer approves</text>
  <text x="360.0" y="625" text-anchor="middle" font-size="10.5" fill="#5f5e5a">main branch only</text>
  <rect x="444" y="576" width="112" height="60" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25"/>
  <text x="500.0" y="595" text-anchor="middle" font-weight="600" font-size="12" fill="#1f1e1d">Deploy job</text>
  <text x="500.0" y="611" text-anchor="middle" font-size="10.5" fill="#5f5e5a">SSH to the VM</text>
  <text x="500.0" y="625" text-anchor="middle" font-size="10.5" fill="#5f5e5a">Auto rollback</text>
  <rect x="164" y="676" width="252" height="40" rx="8" fill="#ffffff" stroke="#9b998f" stroke-width="1.25" stroke-dasharray="6 4"/>
  <text x="290.0" y="695" text-anchor="middle" font-weight="600" font-size="12" fill="#1f1e1d">Kubernetes (K3s) deployment</text>
  <text x="290.0" y="711" text-anchor="middle" font-size="10.5" fill="#5f5e5a">Manifests complete · same images</text>
  <text x="590" y="592" font-size="11" font-weight="600" fill="#5f5e5a">Delivery pipeline</text>
  <g font-size="10.5" fill="#5f5e5a">
    <text x="590" y="610">Every pull request runs CI.</text>
    <text x="590" y="626">Pushes to dev publish images.</text>
    <text x="590" y="642">Only main deploys to the VM.</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#9b998f" stroke-width="1.5">
    <path d="M96 90V106H664M238 90V106M380 90V106M522 90V106M664 90V106" stroke-linecap="round"/>
    <path d="M294 106V156" marker-end="url(#grey)"/>
    <path d="M105 196V228" marker-end="url(#grey)"/>
    <path d="M369 196V228" marker-end="url(#grey)"/>
    <path d="M170 333H190" marker-end="url(#grey)"/>
    <path d="M275 438V474" marker-start="url(#grey)" marker-end="url(#grey)"/>
    <path d="M136 606H164" marker-end="url(#grey)"/>
    <path d="M276 606H304" marker-end="url(#grey)"/>
    <path d="M416 606H444" marker-end="url(#grey)"/>
    <path d="M220 576V540" marker-end="url(#grey)"/>
    <path d="M500 576V540" marker-end="url(#grey)"/>
    <path d="M548 249H590" marker-end="url(#grey)"/>
    <path d="M548 293H590" marker-end="url(#grey)"/>
  </g>
  <g fill="none" stroke="#9b998f" stroke-width="1.5" stroke-dasharray="4 4">
    <path d="M220 636V676" marker-end="url(#grey)"/>
  </g>
  <g fill="none" stroke="#0f766e" stroke-width="1.75" stroke-dasharray="6 4">
    <path d="M463 438V474" marker-start="url(#teal)" marker-end="url(#teal)"/>
    <path d="M548 337H590" marker-end="url(#teal)"/>
    <path d="M548 381H590" marker-end="url(#teal)"/>
    <path d="M548 425H590" marker-end="url(#teal)"/>
  </g>
  <g font-size="10.5" fill="#5f5e5a">
    <text x="302" y="120">HTTPS</text>
    <text x="113" y="212">pages</text>
    <text x="377" y="212">/api</text>
    <text x="283" y="460">SQL</text>
    <text x="228" y="560">pulls images</text>
    <text x="508" y="560">SSH</text>
    <text x="228" y="660">manual</text>
  </g>
  <g font-size="10.5" fill="#0f766e">
    <text x="471" y="460">events</text>
  </g>

  <!-- Legend -->
  <line x1="24" y1="738" x2="60" y2="738" stroke="#9b998f" stroke-width="1.5"/>
  <text x="68" y="742" font-size="11" fill="#1f1e1d">Request</text>
  <line x1="150" y1="738" x2="186" y2="738" stroke="#0f766e" stroke-width="1.75" stroke-dasharray="6 4"/>
  <text x="194" y="742" font-size="11" fill="#1f1e1d">Asynchronous (RabbitMQ events)</text>
  <rect x="400" y="731" width="18" height="13" rx="3" fill="#ffffff" stroke="#9b998f" stroke-dasharray="4 3"/>
  <text x="426" y="742" font-size="11" fill="#1f1e1d">External or optional</text>
</svg>
