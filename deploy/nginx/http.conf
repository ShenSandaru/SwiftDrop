# Initial HTTP configuration for public IP testing and Let's Encrypt ACME HTTP-01 challenge.
# Once your custom domain points to the VM and Certbot has issued a certificate, switch
# SWIFTDROP_NGINX_CONF=./deploy/nginx/https.conf in .env.prod (see docs/production-deployment.md).

server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt / Certbot webroot challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    include /etc/nginx/snippets/swiftdrop-routes.conf;
}
